name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: System Information
      shell: pwsh
      run: |
        Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
        Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
        Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow

        Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
        Get-CimInstance -ClassName Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

    - name: Enable RDP
      shell: pwsh
      run: |
        Write-Host "Enabling Remote Desktop..." -ForegroundColor Green
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Write-Host "RDP Enabled!" -ForegroundColor Green

    - name: Create/Configure User Account
      shell: pwsh
      run: |
        Write-Host "Setting up user account..." -ForegroundColor Green
        $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
        $user = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
        if ($null -eq $user) {
          New-LocalUser -Name "runneradmin" -Password $Password -FullName "runneradmin" -Description "RDP User" -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue
        } else {
          Set-LocalUser -Name "runneradmin" -Password $Password
        }
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
        Write-Host "Username: runneradmin" -ForegroundColor Yellow
        Write-Host "Password: P@ssw0rd!" -ForegroundColor Yellow

    - name: Install Tailscale (Silent)
      shell: pwsh
      run: |
        Write-Host "Downloading Tailscale..." -ForegroundColor Green
        $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
        $installerPath = "$env:TEMP\tailscale.msi"
        Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
        Write-Host "Installing Tailscale silently..." -ForegroundColor Green
        Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
        Remove-Item $installerPath -Force
        Write-Host "Tailscale installed successfully!" -ForegroundColor Green

    - name: Start Tailscale
      shell: pwsh
      run: |
        Write-Host "Starting Tailscale..." -ForegroundColor Green
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey "${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname "enigmano-${{ github.run_id }}"
        Start-Sleep -Seconds 15

    - name: Get Tailscale IP
      shell: pwsh
      run: |
        $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        $tsIP = $tsIP.Trim()
        Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green
        "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Install Google Chrome
      shell: pwsh
      run: |
        Write-Host "Downloading Google Chrome..." -ForegroundColor Green
        $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
        $installerPath = "$env:TEMP\chrome_installer.exe"
        Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath -UseBasicParsing
        Write-Host "Installing Google Chrome silently..." -ForegroundColor Green
        Start-Process -FilePath $installerPath -ArgumentList "/silent /install" -Wait
        Remove-Item $installerPath -Force
        Write-Host "Google Chrome installed!" -ForegroundColor Green

    - name: Install 7-Zip
      shell: pwsh
      run: |
        Write-Host "Downloading 7-Zip..." -ForegroundColor Green
        $zipUrl = "https://www.7-zip.org/a/7z2409-x64.exe"
        $installerPath = "$env:TEMP\7z-installer.exe"
        Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath -UseBasicParsing
        Write-Host "Installing 7-Zip silently..." -ForegroundColor Green
        Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
        Remove-Item $installerPath -Force
        Write-Host "7-Zip installed!" -ForegroundColor Green

    - name: Install Roblox Studio
      shell: pwsh
      run: |
        Write-Host "Downloading Roblox Studio bootstrapper..." -ForegroundColor Green
        $rsUrl = "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe"
        $installerPath = "$env:TEMP\RobloxStudioLauncher.exe"
        try {
          Invoke-WebRequest -Uri $rsUrl -OutFile $installerPath -UseBasicParsing
          Write-Host "Installing Roblox Studio silently..." -ForegroundColor Green
          Start-Process -FilePath $installerPath -ArgumentList "/S", "/silent", "/quiet" -Wait -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 30
          Write-Host "Roblox Studio installer executed!" -ForegroundColor Green
        } catch {
          Write-Host "Roblox Studio install had issues: $_" -ForegroundColor Yellow
        }
        if (Test-Path $installerPath) { Remove-Item $installerPath -Force -ErrorAction SilentlyContinue }

    - name: Enable Windows Dark Mode (for runneradmin)
      shell: pwsh
      run: |
        Write-Host "Configuring Windows Dark Mode for runneradmin..." -ForegroundColor Green

        # Load the runneradmin user's registry hive
        $userProfile = "C:\Users\runneradmin"
        if (-not (Test-Path $userProfile)) {
          Write-Host "Creating profile for runneradmin by triggering logon..." -ForegroundColor Yellow
          # Force profile creation
          $cred = New-Object System.Management.Automation.PSCredential("runneradmin", (ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force))
          try {
            Start-Process cmd.exe -Credential $cred -ArgumentList "/c echo profile" -LoadUserProfile -WorkingDirectory "C:\" -WindowStyle Hidden -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          } catch {
            Write-Host "Profile creation attempt: $_" -ForegroundColor Yellow
          }
        }

        $ntUserDat = "C:\Users\runneradmin\NTUSER.DAT"
        $hiveLoaded = $false
        if (Test-Path $ntUserDat) {
          try {
            reg load "HKU\RunnerAdminHive" $ntUserDat 2>$null
            $hiveLoaded = $true
            Write-Host "Loaded runneradmin registry hive." -ForegroundColor Green
          } catch {
            Write-Host "Could not load hive: $_" -ForegroundColor Yellow
          }
        }

        if ($hiveLoaded) {
          $personalizePath = "HKU:\RunnerAdminHive\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          if (-not (Test-Path $personalizePath)) {
            New-Item -Path $personalizePath -Force | Out-Null
          }
          New-ItemProperty -Path $personalizePath -Name "AppsUseLightTheme" -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $personalizePath -Name "SystemUsesLightTheme" -Value 0 -PropertyType DWord -Force | Out-Null
          Write-Host "Dark Mode applied to runneradmin hive." -ForegroundColor Green

          [gc]::Collect()
          Start-Sleep -Seconds 2
          reg unload "HKU\RunnerAdminHive" 2>$null
        }

        # Also apply to current user (fallback / current runner session)
        $personalizeCurrent = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
        if (-not (Test-Path $personalizeCurrent)) {
          New-Item -Path $personalizeCurrent -Force | Out-Null
        }
        Set-ItemProperty -Path $personalizeCurrent -Name "AppsUseLightTheme" -Value 0 -Type DWord -Force
        Set-ItemProperty -Path $personalizeCurrent -Name "SystemUsesLightTheme" -Value 0 -Type DWord -Force
        Write-Host "Dark Mode applied to current user." -ForegroundColor Green

        # Apply to Default user profile so future logons inherit dark mode
        $defaultHive = "C:\Users\Default\NTUSER.DAT"
        if (Test-Path $defaultHive) {
          try {
            reg load "HKU\DefaultHive" $defaultHive 2>$null
            $defPersonalize = "HKU:\DefaultHive\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
            if (-not (Test-Path $defPersonalize)) {
              New-Item -Path $defPersonalize -Force | Out-Null
            }
            New-ItemProperty -Path $defPersonalize -Name "AppsUseLightTheme" -Value 0 -PropertyType DWord -Force | Out-Null
            New-ItemProperty -Path $defPersonalize -Name "SystemUsesLightTheme" -Value 0 -PropertyType DWord -Force | Out-Null
            [gc]::Collect()
            Start-Sleep -Seconds 2
            reg unload "HKU\DefaultHive" 2>$null
            Write-Host "Dark Mode applied to Default profile." -ForegroundColor Green
          } catch {
            Write-Host "Default hive tweak failed: $_" -ForegroundColor Yellow
          }
        }

        # Restart Explorer to apply theme
        try {
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-Process explorer.exe -ErrorAction SilentlyContinue
          Write-Host "Explorer restarted." -ForegroundColor Green
        } catch {
          Write-Host "Explorer restart notice: $_" -ForegroundColor Yellow
        }

    - name: Connection Details
      shell: pwsh
      run: |
        Write-Host "`n=== CONNECTION DETAILS (TAILSCALE) ===" -ForegroundColor Green
        Write-Host "==========================================" -ForegroundColor Cyan
        Write-Host "         ENIGMANO RDP ACCESS              " -ForegroundColor Cyan
        Write-Host "==========================================" -ForegroundColor Cyan
        Write-Host " Host: $env:TAILSCALE_IP" -ForegroundColor White
        Write-Host " Username: runneradmin" -ForegroundColor White
        Write-Host " Password: P@ssw0rd!" -ForegroundColor White
        Write-Host "==========================================" -ForegroundColor Cyan

        Write-Host "`n=== INSTALLED SOFTWARE ===" -ForegroundColor Yellow
        Write-Host " - Google Chrome" -ForegroundColor White
        Write-Host " - 7-Zip" -ForegroundColor White
        Write-Host " - Roblox Studio" -ForegroundColor White
        Write-Host " - Tailscale (VPN)" -ForegroundColor White

        Write-Host "`n=== ENVIRONMENT STATUS ===" -ForegroundColor Yellow
        Write-Host " - RDP: Enabled" -ForegroundColor Green
        Write-Host " - Firewall: RDP allowed" -ForegroundColor Green
        Write-Host " - Dark Mode: Enabled" -ForegroundColor Green
        Write-Host " - Instance #: ${{ github.event.inputs.instance_number }}" -ForegroundColor Green

        Write-Host "`nConnection Instructions:" -ForegroundColor Yellow
        Write-Host "1. Install Tailscale on your device (phone, tablet, Mac, Linux, Windows)" -ForegroundColor White
        Write-Host "2. Log in with the same Tailscale account" -ForegroundColor White
        Write-Host "3. Open Remote Desktop app and enter the IP above" -ForegroundColor White
        Write-Host "4. Use the provided credentials" -ForegroundColor White

    - name: Keep Session Alive
      shell: pwsh
      run: |
        Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
        Write-Host "EnigMano RDP instance is now running!" -ForegroundColor Cyan
        Write-Host "Instance will remain active for up to 6 hours." -ForegroundColor Yellow
        Write-Host "Do not close this window to maintain the connection." -ForegroundColor Red

        $counter = 0
        while ($true) {
          $counter++
          Write-Host "Session active - Heartbeat #$counter ($(Get-Date))" -ForegroundColor Green

          try {
            $tsStatus = & "C:\Program Files\Tailscale\tailscale.exe" status 2>&1 | Out-String
            if ($tsStatus -match "offline" -or $tsStatus -match "Logged out" -or [string]::IsNullOrWhiteSpace($tsStatus)) {
              Write-Host "Tailscale status: ERROR - Restarting..." -ForegroundColor Red
              & "C:\Program Files\Tailscale\tailscale.exe" up --authkey "${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname "enigmano-${{ github.run_id }}"
            } else {
              Write-Host "Tailscale status: ACTIVE" -ForegroundColor Green
            }
          } catch {
            Write-Host "Tailscale check error: $_" -ForegroundColor Yellow
          }

          Start-Sleep -Seconds 60
        }
